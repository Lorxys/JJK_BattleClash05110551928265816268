<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>JJK Battle Clash</title>
  <meta name="theme-color" content="#24457f">
  <!-- installable sur l'écran d'accueil (Android et iOS), en plein écran, à l'horizontale -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JJK Clash">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Silkscreen&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="stats">
    <div class="who"><span class="kj">五条悟</span> Satoru Gojo</div>
    <div id="wave"></div>
    <div class="bar hp"><span>PV</span><b><i></i></b></div>
    <div class="bar ce"><span>Énergie</span><b><i></i></b></div>
    <div class="bar dom"><span>Territoire</span><b><i></i></b></div>
  </div>

  <button id="sound-btn" aria-label="Son"><i></i></button>
  <button id="pause-btn" aria-label="Pause">II</button>

  <div id="joy"><i></i></div>

  <div id="hud">
    <!-- .aura : halo animé propre à chaque technique ; .ico : icône en pixel art -->
    <div class="skill" data-k="melee">
      <div class="disc"><i class="aura"></i><div class="face"><i class="ico"></i><div class="cd"></div></div></div>
      <div class="nm">Frappe</div>
    </div>
    <div class="skill" data-k="red">
      <div class="disc"><i class="aura"></i><div class="face"><i class="ico"></i><div class="cd"></div></div></div>
      <div class="nm">Rouge</div>
    </div>
    <div class="skill" data-k="blue">
      <div class="disc"><i class="aura"></i><div class="face"><i class="ico"></i><div class="cd"></div></div></div>
      <div class="nm">Bleu</div>
    </div>
    <div class="skill" data-k="purple">
      <div class="disc"><i class="aura"></i><div class="face"><i class="ico"></i><div class="cd"></div>
        <div class="charge"><i></i></div></div></div>
      <div class="nm">Violet</div>
    </div>
    <div class="skill" data-k="dash">
      <div class="disc"><i class="aura"></i><div class="face"><i class="ico"></i><div class="cd"></div></div></div>
      <div class="nm">Téléport</div>
    </div>
    <div class="skill" data-k="domain">
      <div class="disc"><i class="aura"></i><div class="face"><i class="ico"></i><div class="cd"></div></div></div>
      <div class="nm">Territoire</div>
    </div>
  </div>

  <div id="combo"><b></b><span>coups</span></div>

  <div id="banner"><div class="big"></div><div class="small"></div></div>

  <div id="overlay" class="hidden">
    <div class="kanji"></div>
    <div class="big"></div>
    <div class="small"></div>
    <div class="hint"></div>
  </div>

  <div id="rotate">
    <div class="phone"></div>
    <p>Tourne ton appareil à l'horizontale</p>
  </div>

  <script src="js/util.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/gojo.js"></script>
  <script src="js/world.js"></script>
  <script src="js/fire.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/ambience.js"></script>
  <script src="js/abilities.js"></script>
  <script src="js/curses.js"></script>
  <script src="js/domain.js"></script>
  <script src="js/player.js"></script>
  <script src="js/render.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/touch.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
